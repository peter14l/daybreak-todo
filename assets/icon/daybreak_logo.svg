<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C2E" />
      <stop offset="45%" stop-color="#4A2545" />
      <stop offset="75%" stop-color="#D9534F" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#skyGrad)" />

  <!-- Morning Horizon Glow -->
  <ellipse cx="256" cy="350" rx="190" ry="70" fill="#FFA726" opacity="0.4" filter="url(#glow)" />

  <!-- Rising Sun Semicircle -->
  <path d="M 146 340 A 110 110 0 0 1 366 340 Z" fill="url(#sunGrad)" />

  <!-- Horizon Line & Checkmark integrated into sunrays -->
  <path d="M 90 340 L 210 340 L 245 375 L 395 210" fill="none" stroke="url(#checkGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 90 340 L 210 340 L 245 375 L 395 210" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>